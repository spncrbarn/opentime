<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Time">
<title>Open Time</title>
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EE; --paper:#FFFFFF; --ink:#1C2427; --muted:#66726E; --faint:#9AA5A1;
  --line:#D6DCD9; --closed:#33434A; --closed-2:#3D4F57; --closed-ink:#E9EFEC;
  --accent:#3564D6; --accent-soft:#E3EAFB; --danger:#B8434F;
  --shadow:0 1px 2px rgba(28,36,39,.06),0 8px 24px rgba(28,36,39,.07);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --font:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121719; --paper:#1A2023; --ink:#E4EAE8; --muted:#94A09C; --faint:#6A7672;
    --line:#2A3337; --closed:#2C3A40; --closed-2:#34454C; --closed-ink:#D8E2DE;
    --accent:#86A4F2; --accent-soft:#223052; --danger:#E27781;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#121719; --paper:#1A2023; --ink:#E4EAE8; --muted:#94A09C; --faint:#6A7672;
  --line:#2A3337; --closed:#2C3A40; --closed-2:#34454C; --closed-ink:#D8E2DE;
  --accent:#86A4F2; --accent-soft:#223052; --danger:#E27781;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{max-width:1320px;margin:0 auto;padding:20px 24px 40px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;grid-template-rows:auto 1fr;gap:20px 28px;grid-template-areas:"brand corner" "day tasks"}
.brand{grid-area:brand;display:flex;align-items:flex-end;gap:12px}
.brand h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.brand .sync{font-size:12.5px;color:var(--faint)}
.corner{grid-area:corner;justify-self:end;display:flex;align-items:center;gap:22px;background:var(--paper);border-radius:var(--r-lg);padding:14px 20px;box-shadow:var(--shadow)}
.clock{display:flex;flex-direction:column;line-height:1}
.clock .t{font-size:34px;font-weight:600;letter-spacing:-.03em}
.clock .t small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.clock .d{font-size:13px;color:var(--muted);margin-top:6px}
.facts{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:13.5px;border-left:1px solid var(--line);padding-left:20px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600;text-align:right}
.facts button.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:inherit}

.day{grid-area:day;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 150px);position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
.day-head{display:flex;align-items:center;gap:6px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.day-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
.day-head h2 span{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.icon-btn{width:34px;height:34px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.day-scroll{overflow:auto;flex:1;padding:8px 14px 16px 0;overscroll-behavior:contain}
.timeline{position:relative;margin-left:58px}
.hour{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hour span{position:absolute;left:-54px;top:-8px;width:46px;text-align:right;font-size:11.5px;color:var(--faint)}
.blk{position:absolute;left:4px;right:0;border-radius:var(--r-sm);padding:5px 10px;font-size:13px;overflow:hidden;line-height:1.25}
.blk .bt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{font-size:11.5px;opacity:.8}
.blk.closed{background:repeating-linear-gradient(135deg,var(--closed) 0 7px,var(--closed-2) 7px 14px);color:var(--closed-ink)}
.blk.gap{border:1.5px dashed var(--line);background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;cursor:pointer;left:8px;right:4px}
.blk.gap:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.blk.plan{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;left:14px;right:6px;z-index:2;text-align:left;color:var(--ink)}
.blk.plan:hover{border-color:var(--c)}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

.tasks{grid-area:tasks;min-width:0}
.tasks-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tasks-head h2{margin:0;font-size:16px;font-weight:600;flex:1}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;background:var(--paper);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
:root[data-theme="dark"] .btn.primary{color:#101624}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#101624}}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--paper)}
.btn.danger{background:transparent;box-shadow:none;color:var(--danger);padding-left:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;align-items:start}
.cat{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 8px 8px}
.cat-head{display:flex;align-items:center;gap:8px;padding:2px 6px 8px 10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.cat-head h3{margin:0;font-size:15px;font-weight:600;flex:1}
.cat-head .count{font-size:12.5px;color:var(--faint)}
.task{display:flex;align-items:center;gap:6px;padding:6px 4px 6px 2px;border-radius:10px;position:relative;background:var(--paper)}
.task:hover{background:var(--bg)}
.task.dragging{box-shadow:var(--shadow);z-index:5;opacity:.95}
.handle{width:18px;align-self:stretch;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;border:0;background:none;padding:0;flex:none;opacity:.5}
.task:hover .handle{opacity:1}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--c);background:transparent;flex:none;padding:0;display:grid;place-items:center}
.check:hover{background:color-mix(in srgb,var(--c) 18%,transparent)}
.check.on{background:var(--c)}
.task .title{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 4px;font-size:14.5px;overflow-wrap:anywhere}
.chip{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px;flex:none}
.task:hover .chip{background:var(--paper)}
.task .acts{display:none;gap:0}
.task:hover .acts,.task:focus-within .acts{display:flex}
.task:hover .chip,.task:focus-within .chip{display:none}
@media (hover:none){.task .acts{display:flex}.task .chip{display:inline-block!important}.handle{opacity:1}}
.task .acts .icon-btn{width:30px;height:30px}
.rank{font-size:11px;color:var(--faint);width:14px;text-align:right;flex:none}
.add{display:flex;align-items:center;gap:8px;padding:6px 8px 4px 26px}
.add input{flex:1;border:0;background:transparent;padding:6px 4px;font-size:14px;border-bottom:1px solid transparent}
.add input:focus{outline:none;border-bottom-color:var(--line)}
.add input::placeholder{color:var(--faint)}
.empty-cat{font-size:13px;color:var(--faint);padding:2px 10px 6px 30px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,24,26,.42);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.open{display:flex}
.modal{background:var(--paper);border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:22px}
.modal.wide{max-width:620px}
.modal h3{margin:0 0 16px;font-size:18px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-size:15px;width:100%}
.row{display:flex;gap:10px}
.row>*{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c);padding:0}
.sw.on{border-color:var(--ink)}
.days{display:flex;gap:6px}
.days button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font-weight:600;font-size:13px}
.days button.on{background:var(--closed);border-color:var(--closed);color:var(--closed-ink)}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modal-foot{display:flex;align-items:center;gap:10px;margin-top:18px}
.modal-foot .spacer{flex:1}
.blist{margin:0 0 18px;padding:0;list-style:none;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.blist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.blist li:first-child{border-top:0}
.blist .bi{flex:1;min-width:0}
.blist .bi b{font-weight:600;display:block}
.blist .bi span{font-size:12.5px;color:var(--muted)}
.blist .swatch{width:12px;height:28px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--closed) 0 4px,var(--closed-2) 4px 8px);flex:none}
.note{font-size:13px;color:var(--muted);margin:0 0 14px}
.picklist{list-style:none;margin:0;padding:0;max-height:50vh;overflow:auto}
.picklist button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 8px;border-radius:10px;text-align:left}
.picklist button:hover{background:var(--bg)}

/* ---------- focus / timer ---------- */
.focus{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.focus.open{display:flex}
.focus .cat-lbl{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:500}
.focus .ftitle{font-size:clamp(22px,4vw,34px);font-weight:600;letter-spacing:-.01em;margin:10px 0 28px;max-width:22ch}
.ring{position:relative;width:min(72vw,340px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--c);transition:stroke-dashoffset .9s linear}
.ring .left{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px,11vw,72px);font-weight:600;letter-spacing:-.04em}
.focus .ctl{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.focus .ends{font-size:13.5px;color:var(--muted);margin-top:14px}
.spin{font-size:clamp(22px,4vw,32px);font-weight:600;min-height:2.6em;display:flex;align-items:center;justify-content:center;max-width:24ch;margin:8px auto 4px}
.durs{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.durs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.durs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:transparent;border:0;color:var(--paper);font-weight:700;padding:4px 8px;border-radius:999px;text-decoration:underline}

.tabs{display:none}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-areas:"brand" "corner" "main";padding:14px 14px 92px;gap:14px}
  .corner{justify-self:stretch;justify-content:space-between;padding:14px 16px;gap:14px}
  .clock .t{font-size:30px}
  .facts{font-size:12.5px;padding-left:14px;gap:3px 10px}
  .day,.tasks{grid-area:main}
  .day{position:static;max-height:none}
  .day-scroll{max-height:none;overflow:visible}
  body[data-tab="tasks"] .day{display:none}
  body[data-tab="today"] .tasks{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));gap:8px;z-index:40}
  .tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent)}
  .cats{grid-template-columns:1fr}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-tab="today">
<div class="app">
  <div class="brand">
    <h1>Open Time</h1>
    <span class="sync" id="sync">Loading…</span>
  </div>

  <section class="corner" aria-label="Now">
    <div class="clock"><div class="t num" id="clockT">--:--</div><div class="d" id="clockD"></div></div>
    <dl class="facts num">
      <dt id="nextLbl">Next</dt><dd id="nextVal">—</dd>
      <dt>Open today</dt><dd id="openVal">—</dd>
      <dt>Sunset</dt><dd id="sunVal">—</dd>
    </dl>
  </section>

  <section class="day" aria-label="Day">
    <div class="day-head">
      <button class="icon-btn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h2 id="dayTitle">Today</h2>
      <button class="icon-btn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="icon-btn" id="editClosed" aria-label="Edit closed time" title="Edit closed time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    </div>
    <div class="day-scroll" id="dayScroll"><div class="timeline" id="timeline"></div></div>
  </section>

  <section class="tasks" aria-label="Tasks">
    <div class="tasks-head">
      <h2>Tasks</h2>
      <button class="btn ghost" id="addCat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Category</button>
      <button class="btn primary" id="pickBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Pick one for me</button>
    </div>
    <div class="cats" id="cats"></div>
  </section>
</div>

<nav class="tabs" aria-label="Views">
  <button data-tab="today" class="on">Today</button>
  <button data-tab="tasks">Tasks</button>
</nav>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<div class="focus" id="focus" role="dialog" aria-modal="true"></div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastBtn" hidden>Undo</button></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
(function(){
"use strict";

/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const toHHMM = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const fmtTime = (m, short) => { m = Math.round(m); const h = Math.floor(m/60)%24, mm = m%60; const ap = h<12?'am':'pm'; const h12 = h%12||12; return (mm||!short ? h12+':'+pad(mm) : String(h12)) + (short?ap[0]:' '+ap); };
const fmtDur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const dateKey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; };
const DAYS = ['S','M','T','W','T','F','S'];
const DAYNAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const COLORS = ['#3564D6','#2E8B6E','#C0892B','#8A5CC2','#C9546A','#3A9BB5','#7A8480'];
const KINDS = ['Class','Meeting','Work','Other'];
const PPM = 1.15; // px per minute on the timeline

/* ================= state ================= */
function defaults(){
  return {
    v:1, rev:'0',
    categories:[
      {id:'c1',name:'Homework',color:COLORS[0]},
      {id:'c2',name:'Work',color:COLORS[2]},
      {id:'c3',name:'Thesis',color:COLORS[3]},
      {id:'c4',name:'Reading',color:COLORS[1]},
      {id:'c5',name:'Creative',color:COLORS[4]}
    ],
    tasks:[], blocks:[], plans:{},
    settings:{dayStart:7, dayEnd:23, lat:null, lon:null}
  };
}
function normalize(s){
  const d = defaults();
  s = s && typeof s === 'object' ? JSON.parse(JSON.stringify(s)) : d;
  s.categories = Array.isArray(s.categories) ? s.categories : d.categories;
  s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
  s.blocks = Array.isArray(s.blocks) ? s.blocks : [];
  s.plans = s.plans && typeof s.plans === 'object' ? s.plans : {};
  s.settings = Object.assign({}, d.settings, s.settings||{});
  // drop plans for past days
  const today = dateKey(new Date());
  for (const k of Object.keys(s.plans)) if (k < today) delete s.plans[k];
  return s;
}
let S = defaults();
let viewDate = dateKey(new Date());

/* ================= persistence (local + Supabase) ================= */
const LS_KEY = 'open-time-state', LS_PENDING = 'open-time-pending';
const CFG = window.OPEN_TIME_CONFIG || {};
const configured = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && !/YOUR_/.test(CFG.supabaseUrl + CFG.supabaseAnonKey) && window.supabase);
const sb = configured ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}) : null;
let userId = null, writing = false, dirty = false, saveTimer = null;
function lsGet(){ try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function lsSet(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function setPending(v){ try { v ? localStorage.setItem(LS_PENDING,'1') : localStorage.removeItem(LS_PENDING); } catch(e){} }
function isPending(){ try { return localStorage.getItem(LS_PENDING) === '1'; } catch(e){ return false; } }
function setSync(txt){ $('#sync').textContent = txt; }

function commit(){
  S.rev = Date.now() + '-' + uid();
  lsSet();
  render();
  if (!sb || !userId) return;
  setPending(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
}
async function flush(){
  if (!sb || !userId) return;
  if (writing){ dirty = true; return; }
  writing = true; dirty = false;
  const data = JSON.parse(JSON.stringify(S));
  const { error } = await sb.from('open_time_state').upsert({ user_id:userId, data, updated_at:new Date().toISOString() });
  writing = false;
  if (error){ setSync(navigator.onLine ? 'Couldn’t sync, will retry' : 'Offline, saved on this device'); return; }
  if (!dirty){ setPending(false); setSync('Synced'); }
  else flush();
}
async function pull(){
  if (!sb || !userId || writing) return;
  if (isPending()){ flush(); return; }
  const { data, error } = await sb.from('open_time_state').select('data').eq('user_id', userId).maybeSingle();
  if (error){ setSync(navigator.onLine ? 'Couldn’t reach sync' : 'Offline, saved on this device'); return; }
  if (!data){ setPending(true); await flush(); return; }
  if (data.data && data.data.rev !== S.rev && !isPending()){ S = normalize(data.data); lsSet(); render(); }
  setSync('Synced');
}
async function onSignedIn(session){
  userId = session.user.id;
  hideSignIn();
  setSync('Syncing…');
  await pull();
}
async function initStore(){
  const local = lsGet();
  if (local) S = normalize(local);
  render();
  if (!sb){ setSync(configured ? 'Saved on this device' : 'Sync not set up, saved on this device'); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (session) await onSignedIn(session);
  else if (!sessionStorage.getItem('open-time-skip')) showSignIn();
  else setSync('Not signed in, saved on this device');
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_IN' && s && s.user.id !== userId) onSignedIn(s);
    if (ev === 'PASSWORD_RECOVERY') showSignIn('reset');
    if (ev === 'SIGNED_OUT'){ userId = null; setSync('Signed out, saved on this device'); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
  window.addEventListener('online', () => pull());
  setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 60000);
}

/* ---- sign-in screen (email + password, works inside a home-screen app) ---- */
function showSignIn(mode){
  mode = mode || 'in';
  const f = $('#focus'); f.style.setProperty('--c', COLORS[0]);
  const titles = {in:'Sign in', up:'Create your account', forgot:'Reset your password', reset:'Choose a new password'};
  const notes = {
    in:'Sign in to sync your tasks and schedule across your devices.',
    up:'You only do this once. Use the same email and password on every device.',
    forgot:'We’ll email you a link to set a new password.',
    reset:'Type a new password for your account.'
  };
  const btn = {in:'Sign in', up:'Create account', forgot:'Send reset link', reset:'Save password'};
  f.innerHTML = `<div style="width:100%;max-width:360px;text-align:left">
    <h2 style="margin:0 0 6px;font-size:24px;font-weight:600">${titles[mode]}</h2>
    <p class="note" id="siNote">${notes[mode]}</p>
    ${mode!=='reset' ? `<div class="field"><label for="siEmail">Email</label><input id="siEmail" type="email" autocomplete="email" inputmode="email" value="${esc(CFG.email||'')}"></div>` : ''}
    ${mode!=='forgot' ? `<div class="field"><label for="siPw">Password</label><input id="siPw" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" minlength="8"></div>` : ''}
    <p class="note" id="siErr" style="color:var(--danger)" hidden></p>
    <div class="ctl" style="justify-content:flex-start;margin-top:8px"><button class="btn primary" id="siGo">${btn[mode]}</button>${mode==='reset'?'':'<button class="btn ghost" id="siSkip">Not now</button>'}</div>
    <p class="note" style="margin-top:18px">
      ${mode==='in' ? '<button class="btn ghost" style="padding:4px 0" id="siUp">Create an account</button> &nbsp; <button class="btn ghost" style="padding:4px 0" id="siForgot">Forgot password?</button>' : ''}
      ${mode==='up'||mode==='forgot' ? '<button class="btn ghost" style="padding:4px 0" id="siIn">Back to sign in</button>' : ''}
    </p>
  </div>`;
  f.classList.add('open'); f.dataset.mode = mode;
  const err = t => { $('#siErr').textContent = t; $('#siErr').hidden = !t; };
  const go = async () => {
    err('');
    const email = $('#siEmail') ? $('#siEmail').value.trim() : '';
    const password = $('#siPw') ? $('#siPw').value : '';
    if (mode !== 'reset' && !email) return err('Enter your email.');
    if (mode !== 'forgot' && password.length < 8) return err('Passwords need at least 8 characters.');
    $('#siGo').disabled = true;
    let res;
    try {
      if (mode === 'in') res = await sb.auth.signInWithPassword({ email, password });
      else if (mode === 'up') res = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + location.pathname } });
      else if (mode === 'forgot') res = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      else res = await sb.auth.updateUser({ password });
    } catch(e){ res = { error:{ message:'Couldn’t reach the server. Check your connection and try again.' } }; }
    $('#siGo').disabled = false;
    const { data, error } = res;
    if (error){
      const m = /invalid login/i.test(error.message) ? 'That email and password don’t match.' :
                /not confirmed/i.test(error.message) ? 'Confirm your email first: open the link Supabase sent you, then sign in here.' :
                /signups? not allowed|disabled/i.test(error.message) ? 'New accounts are turned off for this app.' : error.message;
      return err(m);
    }
    if (mode === 'forgot'){ $('#siNote').textContent = `Check ${email} for a reset link. Open it in your browser, then come back and sign in.`; $('#siGo').hidden = true; return; }
    if (mode === 'reset'){ hideSignIn(true); toast('Password saved'); return; }
    if (data && data.session) onSignedIn(data.session);
    else if (mode === 'up'){ $('#siNote').textContent = `Almost done. Open the confirmation email sent to ${email}, click the link, then come back here and sign in.`; setTimeout(()=>showSignInKeepNote(email), 0); }
  };
  function showSignInKeepNote(email){ const note = $('#siNote').textContent; showSignIn('in'); $('#siNote').textContent = note; if ($('#siEmail')) $('#siEmail').value = email; }
  $('#siGo').onclick = go;
  f.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
  if ($('#siSkip')) $('#siSkip').onclick = () => { try{ sessionStorage.setItem('open-time-skip','1'); }catch(e){} hideSignIn(); setSync('Not signed in, saved on this device'); };
  if ($('#siUp')) $('#siUp').onclick = () => showSignIn('up');
  if ($('#siForgot')) $('#siForgot').onclick = () => showSignIn('forgot');
  if ($('#siIn')) $('#siIn').onclick = () => showSignIn('in');
  setTimeout(() => { const i = $('#siEmail') || $('#siPw'); if (i) i.focus(); }, 30);
}
function hideSignIn(force){ const f = $('#focus'); if (f.dataset.mode === 'reset' && !force) return; if (f.querySelector('#siGo')){ delete f.dataset.mode; f.classList.remove('open'); f.innerHTML = ''; } }

/* ---- import / export ---- */
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'open-time-backup-' + dateKey(new Date()) + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function importData(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const src = data && data.data && data.data.tasks ? data.data : data;
      if (!src || !Array.isArray(src.tasks) || !Array.isArray(src.categories)) throw new Error('bad');
      if (!confirm(`Replace what's here with ${src.tasks.length} tasks and ${(src.blocks||[]).length} closed-time blocks from this file?`)) return;
      S = normalize(src); commit(); closeModal(); toast('Imported');
    } catch(e){ toast('That file isn’t an Open Time backup'); }
  };
  inp.click();
}

/* ================= schedule math ================= */
function closedFor(key){
  const dow = fromKey(key).getDay();
  return S.blocks
    .filter(b => b.date ? b.date === key : (b.days||[]).includes(dow))
    .map(b => ({...b, s:toMin(b.start), e:toMin(b.end)}))
    .filter(b => b.e > b.s)
    .sort((a,b) => a.s - b.s);
}
function mergeIntervals(list){
  const out = [];
  for (const iv of list.slice().sort((a,b)=>a[0]-b[0])){
    if (out.length && iv[0] <= out[out.length-1][1]) out[out.length-1][1] = Math.max(out[out.length-1][1], iv[1]);
    else out.push([iv[0], iv[1]]);
  }
  return out;
}
function freeIntervals(busy, from, to){
  const merged = mergeIntervals(busy);
  const out = []; let cur = from;
  for (const [s,e] of merged){
    if (e <= cur) continue;
    if (s >= to) break;
    if (s > cur) out.push([cur, Math.min(s,to)]);
    cur = Math.max(cur, e);
  }
  if (cur < to) out.push([cur, to]);
  return out;
}
function plansFor(key){ return (S.plans[key]||[]).map(p => { const t = S.tasks.find(x=>x.id===p.taskId); return t ? {...p, task:t, s:toMin(p.start), e:toMin(p.start)+(t.mins||30)} : null; }).filter(Boolean); }
const dayRange = () => [S.settings.dayStart*60, S.settings.dayEnd*60];

/* ================= sunset (NOAA / SunCalc method) ================= */
function sunset(date, lat, lon){
  const rad = Math.PI/180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad*23.4397, J0 = 0.0009;
  const d0 = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const toDays = dt => dt.valueOf()/dayMs - 0.5 + J1970 - J2000;
  const lw = rad * -lon, phi = rad * lat, d = toDays(d0);
  const n = Math.round(d - J0 - lw/(2*Math.PI));
  const approx = (Ht) => J0 + (Ht + lw)/(2*Math.PI) + n;
  const ds = approx(0);
  const M = rad*(357.5291 + 0.98560028*ds);
  const C = rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  const L = M + C + rad*102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const cosW = (Math.sin(-0.833*rad) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec));
  if (cosW < -1 || cosW > 1) return null;
  const a = approx(Math.acos(cosW));
  const Jset = J2000 + a + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  return new Date((Jset + 0.5 - J1970) * dayMs);
}

/* ================= render: corner ================= */
function renderCorner(){
  const d = new Date();
  const m = d.getHours()*60 + d.getMinutes();
  const h12 = d.getHours()%12||12;
  $('#clockT').innerHTML = `${h12}:${pad(d.getMinutes())}<small>${d.getHours()<12?'am':'pm'}</small>`;
  $('#clockD').textContent = d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

  const key = dateKey(d);
  const closed = closedFor(key);
  const current = closed.find(b => b.s <= m && m < b.e);
  const next = closed.find(b => b.s > m);
  if (current){ $('#nextLbl').textContent = 'In ' + current.title; $('#nextVal').textContent = 'until ' + fmtTime(current.e); }
  else if (next){ $('#nextLbl').textContent = next.title; $('#nextVal').textContent = 'in ' + fmtDur(next.s - m); }
  else { $('#nextLbl').textContent = 'Next'; $('#nextVal').textContent = 'No more closed time'; }

  const [ds, de] = dayRange();
  const free = freeIntervals(closed.map(b=>[b.s,b.e]), Math.max(ds, m), de);
  $('#openVal').textContent = m >= de ? 'Day’s over' : fmtDur(free.reduce((a,[s,e])=>a+e-s,0));

  const {lat, lon} = S.settings;
  if (lat != null && lon != null){
    const ss = sunset(d, lat, lon);
    $('#sunVal').textContent = ss ? fmtTime(ss.getHours()*60+ss.getMinutes()) : '—';
  } else {
    $('#sunVal').innerHTML = '<button class="link" data-act="settings">Set location</button>';
  }
}

/* ================= render: timeline ================= */
function renderDay(){
  const today = dateKey(new Date());
  const vd = fromKey(viewDate);
  const diff = Math.round((vd - fromKey(today))/864e5);
  const label = diff===0 ? 'Today' : diff===1 ? 'Tomorrow' : diff===-1 ? 'Yesterday' : vd.toLocaleDateString(undefined,{weekday:'long'});
  $('#dayTitle').innerHTML = `${label}<span>${vd.toLocaleDateString(undefined,{weekday:diff===0||Math.abs(diff)===1?'long':undefined,month:'short',day:'numeric'})}</span>`;

  const [ds, de] = dayRange();
  const y = m => (m - ds) * PPM;
  const tl = $('#timeline');
  tl.style.height = y(de) + 'px';
  let html = '';
  for (let h = S.settings.dayStart; h <= S.settings.dayEnd; h++){
    html += `<div class="hour" style="top:${y(h*60)}px"><span class="num">${fmtTime(h*60,true)}</span></div>`;
  }
  const closed = closedFor(viewDate).map(b => ({...b, s:Math.max(b.s,ds), e:Math.min(b.e,de)})).filter(b=>b.e>b.s);
  const nowM = viewDate === today ? nowMin() : null;
  const gapFrom = nowM != null ? Math.max(ds, Math.ceil(nowM/5)*5) : ds;
  for (const [s,e] of freeIntervals(closed.map(b=>[b.s,b.e]), ds, de)){
    const vs = Math.max(s, gapFrom);
    if (e - vs < 20) continue;
    html += `<button class="blk gap num" data-act="gap" data-s="${vs}" style="top:${y(vs)+2}px;height:${(e-vs)*PPM-4}px" aria-label="${fmtDur(e-vs)} open from ${fmtTime(vs)}. Plan a task here.">${fmtDur(e-vs)} open</button>`;
  }
  for (const b of closed){
    const h = (b.e-b.s)*PPM - 2;
    html += `<div class="blk closed" style="top:${y(b.s)+1}px;height:${h}px"><div class="bt">${esc(b.title)}</div>${h>34?`<div class="bm num">${fmtTime(b.s)} – ${fmtTime(b.e)}</div>`:''}</div>`;
  }
  for (const p of plansFor(viewDate)){
    const s = Math.max(p.s, ds), e = Math.min(p.e, de); if (e <= s) continue;
    const h = (e-s)*PPM - 2;
    const cat = S.categories.find(c=>c.id===p.task.catId);
    html += `<button class="blk plan" data-act="plan" data-id="${p.id}" style="--c:${cat?cat.color:COLORS[6]};top:${y(s)+1}px;height:${Math.max(h,22)}px"><div class="bt">${esc(p.task.title)}</div>${h>34?`<div class="bm num">${fmtTime(p.s)} · ${fmtDur(p.task.mins||30)}</div>`:''}</button>`;
  }
  if (nowM != null && nowM >= ds && nowM <= de) html += `<div class="now" style="top:${y(nowM)}px"></div>`;
  tl.innerHTML = html;
}
function scrollToNow(){
  const [ds] = dayRange();
  const target = viewDate === dateKey(new Date()) ? (nowMin()-ds-60)*PPM : 0;
  const sc = $('#dayScroll');
  if (sc.scrollHeight > sc.clientHeight) sc.scrollTop = Math.max(0, target);
  else if (window.innerWidth <= 820 && target > 0){ /* mobile: page scroll handled by browser */ }
}

function render(){ renderCorner(); renderDay(); renderTasks(); }

/* ================= task actions ================= */
function parseTask(text){
  let title = text.trim(), mins = null;
  const m = title.match(/\s+(\d+(?:\.\d+)?)\s*(m|min|mins|h|hr|hrs)$/i);
  if (m){ const n = parseFloat(m[1]); mins = /^h/i.test(m[2]) ? Math.round(n*60) : Math.round(n); title = title.slice(0, m.index).trim(); }
  return {title, mins: mins && mins > 0 ? Math.min(mins, 720) : null};
}
function addTask(catId, text){
  const {title, mins} = parseTask(text);
  if (!title) return;
  S.tasks.push({id:uid(), title, catId, mins});
  commit();
  const inp = document.querySelector(`[data-add="${catId}"]`); if (inp) inp.focus();
}
let undo = null;
function completeTask(id){
  const idx = S.tasks.findIndex(t=>t.id===id); if (idx < 0) return;
  const task = S.tasks[idx];
  const removedPlans = {};
  for (const k of Object.keys(S.plans)){
    const keep = S.plans[k].filter(p=>p.taskId!==id);
    if (keep.length !== S.plans[k].length){ removedPlans[k] = S.plans[k].filter(p=>p.taskId===id); S.plans[k] = keep; }
  }
  S.tasks.splice(idx,1);
  undo = () => { S.tasks.splice(Math.min(idx,S.tasks.length),0,task); for (const k in removedPlans){ S.plans[k] = (S.plans[k]||[]).concat(removedPlans[k]); } commit(); };
  commit();
  toast(`Done: ${task.title}`, true);
}
function findSlot(key, mins){
  const [ds,de] = dayRange();
  const busy = closedFor(key).map(b=>[b.s,b.e]).concat(plansFor(key).map(p=>[p.s,p.e]));
  const from = key === dateKey(new Date()) ? Math.max(ds, Math.ceil(nowMin()/5)*5) : ds;
  const slot = freeIntervals(busy, from, de).find(([s,e]) => e - s >= mins);
  return slot ? slot[0] : null;
}

/* ================= toast ================= */
let toastTimer;
function toast(msg, withUndo){
  $('#toastMsg').textContent = msg;
  $('#toastBtn').hidden = !withUndo;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ $('#toast').classList.remove('show'); undo = null; }, withUndo ? 5000 : 2600);
}
$('#toastBtn').onclick = () => { if (undo){ undo(); undo = null; } $('#toast').classList.remove('show'); };

/* ================= modal helpers ================= */
let lastFocus = null;
function openModal(html, wide){
  lastFocus = document.activeElement;
  const m = $('#modal'); m.className = 'modal' + (wide?' wide':''); m.innerHTML = html;

  const t = S.tasks.find(x=>x.id===taskId); if (!t) return;
  const mins = t.mins || 30;

/* ================= focus timer ================= */
const timer = {taskId:null, total:0, left:0, running:false, endAt:0, iv:null};
function startFocus(taskId){
  const t = S.tasks.find(x=>x.id===taskId); if (!t) return;
  timer.taskId = taskId;
  const mins = t.mins || 25;
  const cat = S.categories.find(c=>c.id===t.catId);
  const f = $('#focus'); f.style.setProperty('--c', cat?cat.color:COLORS[0]);
  f.innerHTML = `<div class="cat-lbl"><span class="dot"></span>${esc(cat?cat.name:'')}</div>
    <div class="ftitle">${esc(t.title)}</div>
    <div id="fBody"></div>`;
  f.classList.add('open');
  showDurationChoice(mins, !t.mins);
}
function showDurationChoice(mins, noEst){
  const opts = [15,25,45,60,90]; if (!opts.includes(mins)) opts.push(mins); opts.sort((a,b)=>a-b);
  let sel = mins;
  $('#fBody').innerHTML = `<p class="note">${noEst?'No estimate on this task. How long do you want to work?':'How long?'}</p>
    <div class="durs">${opts.map(m=>`<button data-m="${m}" class="${m===sel?'on':''}">${fmtDur(m)}</button>`).join('')}</div>
    <div class="ctl"><button class="btn ghost" id="fCancel">Cancel</button><button class="btn primary" id="fGo">Start</button></div>`;
  $('#fBody').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { sel = Number(b.dataset.m); $('#fBody').querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#fCancel').onclick = closeFocus;
  $('#fGo').onclick = () => runTimer(sel*60);
  setTimeout(()=>$('#fGo').focus(),30);
}
function runTimer(secs){
  timer.total = secs; timer.left = secs; timer.running = true; timer.endAt = Date.now() + secs*1000;
  const C = 2*Math.PI*46;
  $('#fBody').innerHTML = `<div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46" fill="none" stroke-width="3"/><circle class="prog" id="fProg" cx="50" cy="50" r="46" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="left num" id="fLeft"></div></div>
    <div class="ends num" id="fEnds"></div>
    <div class="ctl"><button class="btn" id="fPause">Pause</button><button class="btn" id="fAdd">+5 min</button><button class="btn primary" id="fDone">Mark done</button><button class="btn ghost" id="fStop">End session</button></div>`;
  $('#fPause').onclick = togglePause;
  $('#fAdd').onclick = () => { timer.total += 300; timer.left += 300; if (timer.running) timer.endAt += 300000; tick(); };
  $('#fDone').onclick = () => { const id = timer.taskId; closeFocus(); completeTask(id); };
  $('#fStop').onclick = closeFocus;
  clearInterval(timer.iv); timer.iv = setInterval(tick, 250); tick();
}
function togglePause(){
  if (timer.running){ timer.running = false; timer.left = Math.max(0,(timer.endAt-Date.now())/1000); $('#fPause').textContent = 'Resume'; }
  else { timer.running = true; timer.endAt = Date.now() + timer.left*1000; $('#fPause').textContent = 'Pause'; }
  tick();
}
function tick(){
  if (timer.running) timer.left = Math.max(0, (timer.endAt - Date.now())/1000);
  const s = Math.ceil(timer.left);
  const el = $('#fLeft'); if (!el) return;
  el.textContent = Math.floor(s/60) + ':' + pad(s%60);
  const C = 2*Math.PI*46; $('#fProg').setAttribute('stroke-dashoffset', String(C * (1 - timer.left/timer.total)));
  const end = new Date(timer.running ? timer.endAt : Date.now() + timer.left*1000);
  $('#fEnds').textContent = timer.running ? `Ends at ${fmtTime(end.getHours()*60+end.getMinutes())}` : 'Paused';
  document.title = (timer.running ? '' : '❚❚ ') + el.textContent + ' · Open Time';
  if (timer.running && timer.left <= 0){
    timer.running = false; clearInterval(timer.iv); chime();
    $('#fEnds').textContent = 'Time’s up';
    $('#fPause').textContent = '+10 min'; $('#fPause').onclick = () => { timer.total += 600; timer.left = 600; timer.running = true; timer.endAt = Date.now()+600000; $('#fPause').textContent='Pause'; $('#fPause').onclick = togglePause; clearInterval(timer.iv); timer.iv = setInterval(tick,250); };
    $('#fAdd').hidden = true;
  }
}
function closeFocus(){ clearInterval(timer.iv); timer.running = false; $('#focus').classList.remove('open'); $('#focus').innerHTML=''; document.title = 'Open Time'; }
function chime(){
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ctx = new A();
    [0, .22, .44].forEach((t,i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type='sine'; o.frequency.value = [660,880,990][i];
      g.gain.setValueAtTime(0, ctx.currentTime+t); g.gain.linearRampToValueAtTime(.18, ctx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.9);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+1); });
  } catch(e){}
}

/* ---- pick one for me ---- */
function pickForMe(){
  // candidates: top 2 of each category, higher rank weighted more
  const pool = [];
  for (const c of S.categories){ tasksIn(c.id).slice(0,2).forEach((t,i) => { for (let k=0;k<(i===0?2:1);k++) pool.push(t); }); }
  if (!pool.length){ toast('Add a few tasks first'); return; }
  const f = $('#focus'); f.style.setProperty('--c', COLORS[0]);
  f.innerHTML = `<div class="cat-lbl" id="pkCat"><span class="dot"></span>&nbsp;</div><div class="spin" id="pkSpin" aria-live="polite"></div>
    <p class="note">Chosen from the top of each category.</p>
    <div class="ctl" id="pkCtl" style="visibility:hidden"><button class="btn ghost" id="pkClose">Not now</button><button class="btn" id="pkAgain">Spin again</button><button class="btn primary" id="pkGo">Start timer</button></div>`;
  f.classList.add('open');
  $('#pkClose').onclick = closeFocus;
  $('#pkAgain').onclick = () => spin();
  let chosen = null;
  $('#pkGo').onclick = () => { if (chosen) startFocus(chosen.id); };
  const show = t => { const c = S.categories.find(x=>x.id===t.catId); f.style.setProperty('--c', c?c.color:COLORS[0]); $('#pkCat').innerHTML = `<span class="dot"></span>${esc(c?c.name:'')}`; $('#pkSpin').textContent = t.title; };
  function spin(){
    $('#pkCtl').style.visibility = 'hidden';
    const final = pool[Math.floor(Math.random()*pool.length)];
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const all = S.tasks.length ? S.tasks : pool;
    let i = 0, steps = reduce ? 0 : 14;
    const step = () => {
      if (i >= steps){ chosen = final; show(final); $('#pkCtl').style.visibility = 'visible'; $('#pkGo').focus(); return; }
      show(all[Math.floor(Math.random()*all.length)]); i++;
      setTimeout(step, 50 + i*i*1.6);
    };
    step();
  }
  spin();
}

/* ================= drag to reorder (mouse + touch) ================= */
let drag = null;
$('#cats').addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-handle]'); if (!h) return;
  const row = h.closest('.task'); const list = row.parentElement;
  e.preventDefault();
  const rect = row.getBoundingClientRect();
  drag = {row, list, startY:e.clientY, offset:e.clientY - rect.top, catId:list.dataset.cat, id:row.dataset.id};
  row.classList.add('dragging');
  h.setPointerCapture(e.pointerId);
});
$('#cats').addEventListener('pointermove', e => {
  if (!drag) return;
  drag.row.style.transform = `translateY(${e.clientY - drag.startY}px)`;
  const rows = [...drag.list.querySelectorAll('.task')].filter(r=>r!==drag.row);
  let before = null;
  for (const r of rows){ const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height/2){ before = r; break; } }
  drag.before = before;
});
const endDrag = () => {
  if (!drag) return;
  const {row, catId, id, before} = drag; drag = null;
  row.classList.remove('dragging'); row.style.transform = '';
  const ids = tasksIn(catId).map(t=>t.id).filter(x=>x!==id);
  const pos = before ? ids.indexOf(before.dataset.id) : ids.length;
  ids.splice(pos, 0, id);
  const moved = ids.map(x => S.tasks.find(t=>t.id===x));
  const others = S.tasks.filter(t=>t.catId!==catId);
  const changed = moved.map(t=>t.id).join() !== tasksIn(catId).map(t=>t.id).join();
  if (changed){ S.tasks = others.concat(moved); commit(); } else renderTasks();
};
$('#cats').addEventListener('pointerup', endDrag);
$('#cats').addEventListener('pointercancel', endDrag);
// keyboard reorder on the handle
$('#cats').addEventListener('keydown', e => {
  const h = e.target.closest('[data-handle]');
  if (h && (e.key==='ArrowUp'||e.key==='ArrowDown')){
    e.preventDefault();
    const id = h.closest('.task').dataset.id, t = S.tasks.find(x=>x.id===id);
    const ids = tasksIn(t.catId).map(x=>x.id); const i = ids.indexOf(id), j = i + (e.key==='ArrowUp'?-1:1);
    if (j<0||j>=ids.length) return;
    [ids[i],ids[j]] = [ids[j],ids[i]];
    S.tasks = S.tasks.filter(x=>x.catId!==t.catId).concat(ids.map(x=>S.tasks.find(y=>y.id===x)));
    commit();
    const nh = document.querySelector(`.task[data-id="${id}"] [data-handle]`); if (nh) nh.focus();
  }
  const inp = e.target.closest('[data-add]');
  if (inp && e.key==='Enter'){ addTask(inp.dataset.add, inp.value); }
});

/* ================= global click routing ================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')){ closeModal(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'done': a.classList.add('on'); setTimeout(()=>completeTask(id), 180); break;
    case 'edittask': editTask(id); break;
    case 'plantask': planTask(id); break;
    case 'timer': startFocus(id); break;
    case 'editcat': editCategory(id); break;
    case 'gap': pickTaskForGap(Number(a.dataset.s)); break;
    case 'plan': planOptions(id); break;
    case 'settings': settings(); break;
  }
});
$('#addCat').onclick = () => editCategory(null);
$('#pickBtn').onclick = pickForMe;
$('#editClosed').onclick = closedList;
$('#openSettings').onclick = settings;
const shiftDay = n => { const d = fromKey(viewDate); d.setDate(d.getDate()+n); const k = dateKey(d); viewDate = k; renderDay(); scrollToNow(); };
$('#prevDay').onclick = () => shiftDay(-1);
$('#nextDay').onclick = () => shiftDay(1);
$('#dayTitle').onclick = () => { viewDate = dateKey(new Date()); renderDay(); scrollToNow(); };
function setTab(t){ document.body.dataset.tab = t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t)); }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ================= clock loop ================= */
let lastKey = dateKey(new Date()), lastMinute = -1;
setInterval(() => {
  const d = new Date();
  if (d.getMinutes() !== lastMinute){
    lastMinute = d.getMinutes();
    const k = dateKey(d);
    if (k !== lastKey){ if (viewDate === lastKey) viewDate = k; lastKey = k; S = normalize(S); }
    renderCorner(); renderDay();
  }
}, 1000);

render();
setTimeout(scrollToNow, 50);
initStore();
})();
</script>
